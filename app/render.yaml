services:
  - type: web
    name: secure-business-platform
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_STORAGE_BUCKET
        sync: false        # e.g. your-project-id.firebasestorage.app (set in the Render dashboard)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false        # paste the full service-account JSON (set in the Render dashboard)
